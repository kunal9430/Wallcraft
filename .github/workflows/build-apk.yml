name: Build Wallcraft APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Bundle the web app into the APK
        run: |
          WWW=android/app/src/main/assets/www
          rm -rf "$WWW" && mkdir -p "$WWW"
          cp index.html app.js icon.svg "$WWW"/
          sed -i '/builder.puter.com\/runtime.js/d' "$WWW/index.html"

      - name: Build APK
        working-directory: android
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/Wallcraft.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Wallcraft-APK
          path: out/Wallcraft.apk
